# Reinforcement Learning Configuration

# Algorithm selection
algorithm: "PPO"  # Options: PPO, A2C, DQN, SAC

# Training parameters
training:
  total_timesteps: 100000
  eval_freq: 5000
  save_freq: 10000
  n_eval_episodes: 10
  learning_rate: 0.0003
  batch_size: 64
  n_epochs: 10
  
# PPO specific parameters
ppo:
  n_steps: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  
# Network architecture
network:
  policy_type: "MlpPolicy"  # Options: MlpPolicy, CnnPolicy, MultiInputPolicy
  net_arch:
    - 256
    - 256
    - 128
  activation: "tanh"  # Options: tanh, relu, elu
  
# Exploration parameters
exploration:
  exploration_fraction: 0.1
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  
# Reward function weights
reward:
  fidelity_weight: 1.0
  throughput_weight: 0.5
  latency_weight: -0.3
  energy_weight: -0.1
  success_rate_weight: 0.8
  
# Action space
action_space:
  type: "discrete"  # Options: discrete, continuous, multi_discrete
  num_actions: 10
  
# Observation space
observation_space:
  include_node_state: true
  include_channel_state: true
  include_entanglement_state: true
  include_buffer_state: true
  normalization: true
  
# Advanced settings
advanced:
  use_tensorboard: true
  verbose: 1
  device: "auto"  # Options: auto, cpu, cuda
  seed: 42
