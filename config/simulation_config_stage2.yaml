# Curriculum Stage-2 (medium): increase distance/noise

network:
  num_nodes: 5
  topology: "linear"
  distance_range: [10, 40]

quantum_channel:
  fiber_loss_coefficient: 0.10
  depolarizing_rate: 0.006
  dephasing_rate: 0.003

noise:
  enable_noise: true
  noise_model: "depolarizing"
  gate_error_rate: 0.0008
  measurement_error_rate: 0.008

repeater:
  enable_repeaters: true
  max_repeaters: 3
  swap_success_probability: 0.985
  memory_coherence_time: 1.0

entanglement:
  initial_fidelity: 0.99
  target_fidelity: 0.93
  purification_enabled: true
  distillation_rounds: 2

simulation:
  time_slots: 800
  max_episode_steps: 250
  random_seed: 42
  parallel_simulations: 1

action_space:
  num_actions: 4

reward:
  fidelity_weight: 2.8

metrics:
  track_fidelity: true
  track_throughput: true
  track_latency: true
  track_success_rate: true
