# Curriculum Stage-3 (hard): near target deployment setting

network:
  num_nodes: 6
  topology: "linear"
  distance_range: [10, 70]

quantum_channel:
  fiber_loss_coefficient: 0.12
  depolarizing_rate: 0.008
  dephasing_rate: 0.003

noise:
  enable_noise: true
  noise_model: "depolarizing"
  gate_error_rate: 0.001
  measurement_error_rate: 0.01

repeater:
  enable_repeaters: true
  max_repeaters: 4
  swap_success_probability: 0.98
  memory_coherence_time: 1.0

entanglement:
  initial_fidelity: 0.99
  target_fidelity: 0.95
  purification_enabled: true
  distillation_rounds: 2

simulation:
  time_slots: 1000
  max_episode_steps: 300
  random_seed: 42
  parallel_simulations: 1

action_space:
  num_actions: 4

reward:
  fidelity_weight: 2.5

metrics:
  track_fidelity: true
  track_throughput: true
  track_latency: true
  track_success_rate: true
